<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="80%" fy="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5" stroke-opacity="0.8" />
    </pattern>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#94a3b8" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <rect width="100%" height="100%" fill="url(#bg-glow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- LEFT SIDE: Text Content -->
  <g transform="translate(60, 90)">
    <!-- Name -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="url(#text-grad)" letter-spacing="-1.5">Advait Warang</text>
    
    <!-- Title -->
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#0284C7" letter-spacing="0.5">
      Backend Developer <tspan fill="#94a3b8"> • </tspan> <tspan fill="#64748b">Computer Engineering Student</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#475569" line-height="1.5">
      <tspan x="0" dy="0">Building scalable backend systems, modern web applications,</tspan>
      <tspan x="0" dy="24">and automation tools with clean architecture.</tspan>
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: Node.js -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="85" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="42.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">Node.js</text>
      </g>
      <!-- Pill 2: Express -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="85" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="42.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">Express</text>
      </g>
      <!-- Pill 3: React -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="75" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="37.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">React</text>
      </g>
      <!-- Pill 4: PostgreSQL -->
      <g transform="translate(275, 0)">
        <rect x="0" y="0" width="100" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="50" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">PostgreSQL</text>
      </g>
      
      <!-- Pill 5: Docker -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="80" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">Docker</text>
      </g>
      <!-- Pill 6: AWS -->
      <g transform="translate(90, 42)">
        <rect x="0" y="0" width="65" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="32.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">AWS</text>
      </g>
      <!-- Pill 7: Git -->
      <g transform="translate(165, 42)">
        <rect x="0" y="0" width="60" height="32" rx="16" fill="#F8FAFC" stroke="#e2e8f0" stroke-width="1" />
        <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">Git</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Abstract Geometry -->
  <g transform="translate(560, 40)">
    <!-- Orbs -->
    <circle cx="180" cy="150" r="200" fill="url(#orb1)" />
    <circle cx="300" cy="80" r="140" fill="url(#orb2)" />
    
    <!-- Code block / Layout card -->
    <g filter="url(#shadow)">
      <rect x="60" y="40" width="280" height="200" rx="16" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="1.5" />
      <rect x="60" y="40" width="280" height="200" rx="16" fill="url(#bg-glow)" opacity="0.3" />
      
      <!-- Fake UI Elements -->
      <circle cx="85" cy="65" r="5" fill="#e2e8f0" />
      <circle cx="100" cy="65" r="5" fill="#e2e8f0" />
      <circle cx="115" cy="65" r="5" fill="#e2e8f0" />
      
      <rect x="85" y="95" width="200" height="8" rx="4" fill="#f1f5f9" />
      <rect x="85" y="115" width="160" height="8" rx="4" fill="#2563EB" />
      <rect x="85" y="135" width="180" height="8" rx="4" fill="#f1f5f9" />
      
      <rect x="85" y="170" width="110" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="205" y="170" width="80" height="32" rx="8" fill="#2563EB" />
    </g>
    
    <!-- Floating Sub-card -->
    <g transform="translate(200, 160)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="130" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" stroke-opacity="0.3" />
      <rect x="0" y="0" width="180" height="130" rx="12" fill="url(#orb1)" opacity="0.1" />
      
      <rect x="20" y="25" width="45" height="45" rx="10" fill="#f1f5f9" />
      <path d="M 35 47 L 42 54 L 50 47" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      
      <rect x="80" y="32" width="70" height="6" rx="3" fill="#cbd5e1" />
      <rect x="80" y="50" width="50" height="6" rx="3" fill="#94a3b8" />
      
      <rect x="20" y="95" width="140" height="6" rx="3" fill="#e2e8f0" />
    </g>

    <!-- Abstract Connecting Lines -->
    <path d="M -10 130 C 30 130, 30 240, 80 240" fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <circle cx="-10" cy="130" r="4" fill="#0284C7" />
    <circle cx="80" cy="240" r="4" fill="#2563EB" />
    
    <!-- Small geometric accents -->
    <rect x="40" y="260" width="10" height="10" rx="2" fill="#0284C7" transform="rotate(45 45 265)" />
    <circle cx="360" cy="30" r="3" fill="#2563EB" opacity="0.5" />
    <circle cx="380" cy="70" r="4" fill="#94a3b8" />
  </g>
</svg>
